name: Backup do banco

# A Neon gratuita não tem backup. Este fluxo gera uma cópia criptografada todo dia, guarda num bucket
# S3-compatível (Cloudflare R2, Backblaze B2...) e TESTA a restauração num PostgreSQL descartável.
# Segredos (Settings → Secrets and variables → Actions): BACKUP_DATABASE_URL, BACKUP_PASSPHRASE,
# BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET, BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY.
# NUNCA publique a cópia como artefato do GitHub: em repositório público, artefatos são baixáveis por qualquer pessoa.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    services:
      restauracao:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: descartavel
          POSTGRES_DB: restauracao
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente do PostgreSQL 16
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Gerar cópia criptografada
        id: dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: echo "arquivo=$(scripts/backup.sh)" >> "$GITHUB_OUTPUT"

      - name: Testar a restauração
        env:
          ARQUIVO: ${{ steps.dump.outputs.arquivo }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RESTORE_DATABASE_URL: postgres://postgres:descartavel@localhost:5432/restauracao
        run: scripts/testar-restauracao.sh

      - name: Enviar ao bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 cp "${{ steps.dump.outputs.arquivo }}" "s3://${{ secrets.BACKUP_S3_BUCKET }}/" --endpoint-url "${{ secrets.BACKUP_S3_ENDPOINT }}"
